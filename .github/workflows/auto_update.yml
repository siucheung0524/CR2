name: Update All Podcasts

# 已停用定時排程：避免在本地 AI 去廣告處理期間，GitHub Action 搶先抓取電台未去廣告原始音檔推送至 RSS
# 如需手動測試可使用 workflow_dispatch 觸發
on:
  workflow_dispatch: 

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Install dependencies
        run: pip install requests
      - name: Update Podcasts
        run: |
          python update_podcast.py
          python update_ilub.py
      - name: Commit and Push
        run: |
          git config --global user.name "GitHub Action"
          git config --global user.email "action@github.com"
          git add rss.xml ilub.xml
          git commit -m "Auto-check for new episodes" || exit 0
          git push
